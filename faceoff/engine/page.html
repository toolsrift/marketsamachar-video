<body><div id="stage">
 <div class="ab glow" id="gA" style="background:radial-gradient(circle,rgba(79,163,255,.16),transparent 62%)"></div>

</div>
<script src="SPEC"></script>
<script>
const A=D.a,B=D.b,SC=V.scenes,VAR=V.var;
document.body.className=`look-${V.look} mo-${V.motion} st-${V.structure}`;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,s,d)=>cl((t-s)/d);
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eb=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
const st=(e,o)=>{if(typeof e==='string')e=$(e);if(!e)return;for(const k in o)e.style[k]=o[k]};
const inr=(v,d=0)=>Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const Lc=v=>(v/1e5).toFixed(2), Kc=v=>(v/1e3).toFixed(1);
function rise(e,t,s,d=.5,dy=40){const p=eo(P(t,s,d));st(e,{opacity:p,transform:`translateY(${(1-p)*dy}px)`})}
function pop(e,t,s,d=.45,f=.4){const p=P(t,s,d);st(e,{opacity:cl(p*3),transform:`scale(${f+(1-f)*eb(p)})`})}
function slide(e,t,s,d=.5,dx=-60){const p=eo(P(t,s,d));st(e,{opacity:p,transform:`translateX(${(1-p)*dx}px)`})}
function count(e,t,s,d,v,fmt){const p=eo(P(t,s,d));$(e).textContent=fmt(v*p)}
$('foot').textContent='Educational only · Not investment advice · Not SEBI-registered · Data: Screener.in, company Q2 FY27 releases · '+D.asof;
const C={};
/* ======================= COMPONENTS ======================= */
// ---- intro
C.intro=(v,S)=>{
 if(V.structure==='rounds'){
  const rows=[['Market cap','₹'+Lc(A.mcap)+' L Cr','₹'+Lc(B.mcap)+' L Cr'],['Share price','₹'+inr(A.price),'₹'+inr(B.price)],['P/E',A.pe,B.pe],['ROE',A.roe+'%',B.roe+'%'],['Dividend yield',A.dy.toFixed(2)+'%',B.dy.toFixed(2)+'%'],['1-year return',A.ret['1Y']+'%',B.ret['1Y']+'%']];
  return {html:`<div class="ab tk ca" id="in_a" style="left:110px;top:300px;width:600px;font-size:120px;text-align:center">${A.tick}</div>
   <div class="ab cs" id="in_an" style="left:110px;top:440px;width:600px;text-align:center;font-weight:700;font-size:30px">${A.name}</div>
   <div class="ab tk cb" id="in_b" style="left:1210px;top:300px;width:600px;font-size:120px;text-align:center">${B.tick}</div>
   <div class="ab cs" id="in_bn" style="left:1210px;top:440px;width:600px;text-align:center;font-weight:700;font-size:30px">${B.name}</div>
   <div class="ab tk cg" id="in_vs" style="left:860px;top:330px;width:200px;text-align:center;font-size:90px">VS</div>
   ${rows.map((r,i)=>`<div class="ab" id="in_r${i}" style="left:310px;top:${530+i*72}px;width:1300px;height:62px;display:flex;align-items:center;border-bottom:2px solid var(--grid)">

  anim(t,b){slide('in_a',t,.3,.6,-200);slide('in_an',t,.5,.6,-200);slide('in_b',t,.3,.6,200);slide('in_bn',t,.5,.6,200);pop('in_vs',t,.7,.5,.2);
   for(let i=0;i<6;i++)rise('in_r'+i,t,b[1]+.2+i*.32,.4,20)}};
 }
 return {html:`<div class="ab" id="in_a" style="left:260px;top:250px;width:520px;height:520px;border-radius:50%;border:14px solid var(--a);display:flex;flex-direction:column;align-items:center;justify-content:center">
   <div class="tk ca" style="font-size:150px;line-height:1">${A.tick}</div><div class="cs" style="font-weight:700;font-size:28px;margin-top:14px;text-align:center">${A.name}</div></div>
  <div class="ab" id="in_b" style="left:1140px;top:250px;width:520px;height:520px;border-radius:50%;border:14px solid var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center">
   <div class="tk cb" style="font-size:130px;line-height:1">${B.tick}</div><div class="cs" style="font-weight:700;font-size:28px;margin-top:14px">${B.name} Ltd</div></div>
  <div class="ab" id="in_vs" style="left:860px;top:410px;width:200px;height:200px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center"><span class="tk" style="font-size:80px;color:var(--onG);font-family:Slab">VS</span></div>
  <div class="ab" style="left:0;width:1920px;top:830px;display:flex;justify-content:center;gap:26px">
   <span class="chip card" id="in_c0" style="font-size:32px;padding:16px 30px">Combined value <span class="num cg" style="font-size:40px">₹${((A.mcap+B.mcap)/1e5).toFixed(1)} L Cr</span></span>
   <span class="chip card" id="in_c1" style="font-size:32px;padding:16px 30px">1-year <span class="num ca" style="font-size:40px">${A.ret['1Y']}%</span><span class="num cb" style="font-size:40px">${B.ret['1Y']}%</span></span></div>`,
  anim(t,b){const pa=eb(P(t,.3,.7)),pb=eb(P(t,.4,.7));st('in_a',{transform:`translateX(${(1-pa)*-900}px)`});st('in_b',{transform:`translateX(${(1-pb)*900}px)`});
   const pv=P(t,.8,.4);st('in_vs',{opacity:cl(pv*3),transform:`scale(${3-2*eo(pv)})`});pop('in_c0',t,b[1]+.6,.45,.6);pop('in_c1',t,b[1]+2.6,.45,.6)}};
};
// ---- size
C.size=(v,S)=>{if(v===2)return C.size2(S);const ra=A.sales10[9]/B.sales10[9],rm=A.mcap/B.mcap;
 if(v===0){const R1=270,R2=270*Math.sqrt(B.mcap/A.mcap);
  return {html:`<div class="ab lbl" id="sz_l" style="left:110px;top:280px">Market cap · bubble area to scale</div>

    <div class="tk" style="font-size:64px">${B.tick}</div><div class="num" style="font-size:50px">₹<span id="sz_bv">0</span> L Cr</div></div>

   <div class="ab card" id="sz_r" style="left:1360px;top:330px;width:450px;height:560px;padding:40px">
    <div class="lbl">Revenue · FY26</div>
    <div class="tk ca" style="font-size:44px;margin-top:30px">${A.tick}</div><div class="num" style="font-size:72px">₹${Lc(A.sales10[9])}<span class="cs" style="font-size:32px"> L Cr</span></div>

  anim(t,b){pop('sz_a',t,b[0]+.2,.6,.2);pop('sz_b',t,b[0]+2.2,.6,.2);rise('sz_l',t,.6);count('sz_av',t,b[0]+.4,1.2,A.mcap/1e5,x=>x.toFixed(2));count('sz_bv',t,b[0]+2.4,1.2,B.mcap/1e5,x=>x.toFixed(2));
   pop('sz_x',t,b[0]+4,.45,.5);slide('sz_r',t,b[1],.6,120)}};}
 const bar=(id,S,val,max,lab,y)=>`<div class="ab" style="left:110px;top:${y}px;width:1700px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="tk" style="font-size:40px;color:var(--${S===A?'a':'b'})">${S.tick}</span><span class="num" style="font-size:46px">${lab}</span></div>

 return {html:`<div class="ab lbl" id="sz_l1" style="left:110px;top:290px">Market cap</div>${bar('sz_ba',A,A.mcap,A.mcap,'₹'+Lc(A.mcap)+' L Cr',330)}${bar('sz_bb',B,B.mcap,A.mcap,'₹'+Lc(B.mcap)+' L Cr',480)}
  <div class="ab lbl" id="sz_l2" style="left:110px;top:640px">Revenue · FY26</div>${bar('sz_ra',A,0,0,'₹'+Lc(A.sales10[9])+' L Cr',690)}${bar('sz_rb',B,0,0,'₹'+Lc(B.sales10[9])+' L Cr',840)}

else st(world,{width:'1920px',height:'1080px'});

 d.innerHTML=fr+comp.html;world.appendChild(d);d._a=comp.anim;return d});

   st(w,{display:'block',left:((dir>0?e:1920-e)-23)+'px',transform:`skewX(${dir>0?-16.5:16.5}deg)`})}else st(w,{display:'none'})}
 else{if(i>0&&p<1){st(EL[i-1],{transform:`translateX(${-p*1300}px) rotateY(${p*38}deg) scale(${1-.18*p})`,opacity:1-p});}
